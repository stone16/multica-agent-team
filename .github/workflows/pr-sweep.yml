name: PR Sweep

# Periodically scans open PRs across stone16/* and dispatches code-review work
# to the Engineer peer lane (the Engineer instance that did not author the PR)
# and the Evaluator adversarial lane when needed. Filtering is deterministic
# shell — no LLM is invoked unless real review work exists.
#
# Operational identity (agent names, mention links, workspace id, ignore list)
# lives in GitHub Actions secrets/variables — never in tracked files.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Avoid overlapping sweeps. If a sweep is still running when the next cron tick
# fires, the new run is queued, not started in parallel — prevents duplicate
# Multica issue creation for the same PR.
concurrency:
  group: pr-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets (GH_PAT, MULTICA_TOKEN) are deliberately NOT job-level env:
    # they are scoped to the individual steps that consume them, so the
    # downloaded multica binary and the sweep script never see them in their
    # environment.
    env:
      MULTICA_SERVER_URL: 'https://api.multica.ai'
      MULTICA_WORKSPACE_ID: ${{ vars.MULTICA_WORKSPACE_ID }}
      GH_OWNER: stone16
      # Multica assignee names; the script defaults to Engineer-A / Engineer-B /
      # Evaluator-A / Orchestrator when a variable is unset. CEO_* names remain
      # compatibility identifiers for the established sentinel protocol.
      ENGINEER_A_AGENT: ${{ vars.ENGINEER_A_AGENT }}
      ENGINEER_B_AGENT: ${{ vars.ENGINEER_B_AGENT }}
      EVALUATOR_AGENT: ${{ vars.EVALUATOR_AGENT }}
      CEO_AGENT: ${{ vars.CEO_AGENT }}
      # Mention links in the `[@Name](mention://agent/<uuid>)` form. CEO_MENTION
      # is the only mention the sweep ever emits — every non-approve outcome
      # routes to the CEO, who dispatches rework. The Engineer/Evaluator
      # mentions map a PR's `Original author:` line to a roster identity for
      # the peer-lane pick only. All four are required; the check step below
      # fails the run before the sweep if any is unset.
      CEO_MENTION: ${{ vars.CEO_MENTION }}
      ENGINEER_A_MENTION: ${{ vars.ENGINEER_A_MENTION }}
      ENGINEER_B_MENTION: ${{ vars.ENGINEER_B_MENTION }}
      EVALUATOR_MENTION: ${{ vars.EVALUATOR_MENTION }}
      # GitHub logins (newline/space separated) whose PR comments may carry
      # authoritative review sentinels (engineer-reviewed / evaluator-reviewed
      # / ceo-resolved / consensus / debate). Defaults to GH_OWNER when unset —
      # set it to the bot login(s) the agents comment through. Sentinels in
      # comments from any other author are ignored, so arbitrary commenters on
      # a public repo can never forge review state.
      TRUSTED_SENTINEL_AUTHORS: ${{ vars.TRUSTED_SENTINEL_AUTHORS }}
      # Newline-separated repo names to exclude from the sweep. Kept as a
      # GitHub Actions variable so private repo names never live in tracked
      # files; the tracked .pr-sweep-ignore file is the fallback when unset.
      PR_SWEEP_IGNORE: ${{ vars.PR_SWEEP_IGNORE }}
    steps:
      - name: Check required secrets and variables are present
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
        run: |
          set -e
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is not configured. Generate a GitHub PAT with 'repo' scope and add it to repo secrets."
            exit 1
          fi
          if [ -z "$MULTICA_TOKEN" ]; then
            echo "::error::MULTICA_TOKEN secret is not configured. Generate a Multica PAT and add it to repo secrets."
            exit 1
          fi
          if [ -z "$MULTICA_WORKSPACE_ID" ]; then
            echo "::error::MULTICA_WORKSPACE_ID variable is not configured. Add the Multica workspace UUID as a GitHub Actions variable."
            exit 1
          fi
          if [ -z "$CEO_MENTION" ]; then
            echo "::error::CEO_MENTION variable is not configured. Add the Orchestrator mention link as a GitHub Actions variable so escalations reach the Orchestrator."
            exit 1
          fi
          if [ -z "$ENGINEER_A_MENTION" ]; then
            echo "::error::ENGINEER_A_MENTION variable is not configured. Add the Engineer-A mention link ([@Engineer-A](mention://agent/<uuid>)) as a GitHub Actions variable; the peer-lane pick depends on it."
            exit 1
          fi
          if [ -z "$ENGINEER_B_MENTION" ]; then
            echo "::error::ENGINEER_B_MENTION variable is not configured. Add the Engineer-B mention link ([@Engineer-B](mention://agent/<uuid>)) as a GitHub Actions variable; the peer-lane pick depends on it."
            exit 1
          fi
          if [ -z "$EVALUATOR_MENTION" ]; then
            echo "::error::EVALUATOR_MENTION variable is not configured. Add the Evaluator-A mention link as a GitHub Actions variable; author-identity mapping depends on it."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # The binary runs with access to the workspace and (in later steps)
      # authenticated CLIs, so it is never executed unverified: the tarball is
      # pinned to an exact version AND an exact sha256. When bumping
      # MULTICA_VERSION, recompute the checksum from the release asset
      # (sha256sum multica-cli-<ver>-linux-amd64.tar.gz) and update both
      # values together — a mismatch hard-fails the run.
      - name: Install multica CLI (pinned version + checksum)
        env:
          MULTICA_VERSION: '0.4.11'
          MULTICA_SHA256: 'b6069f1b1413bc5aaebfa23e44a376647426b70d181ae79ee1e65c8120150f7d'
        run: |
          set -e
          curl -fsSL -o multica-cli.tar.gz \
            "https://github.com/multica-ai/multica/releases/download/v${MULTICA_VERSION}/multica-cli-${MULTICA_VERSION}-linux-amd64.tar.gz"
          if ! printf '%s  multica-cli.tar.gz\n' "$MULTICA_SHA256" | sha256sum -c -; then
            echo "::error::multica CLI tarball sha256 mismatch for v${MULTICA_VERSION} — refusing to execute an unverified binary."
            exit 1
          fi
          tar -xzf multica-cli.tar.gz multica
          rm -f multica-cli.tar.gz
          sudo mv multica /usr/local/bin/multica
          multica --version

      - name: Configure multica CLI
        run: |
          set -e
          multica config set server_url "$MULTICA_SERVER_URL"
          multica config set workspace_id "$MULTICA_WORKSPACE_ID"

      - name: Authenticate multica
        env:
          MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
        run: multica login --token "$MULTICA_TOKEN"

      - name: Authenticate gh (with cross-repo PAT)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          printf '%s' "$GH_PAT" | gh auth login --with-token
          gh auth status

      - name: Run PR sweep
        run: ./.github/scripts/pr-sweep.sh
