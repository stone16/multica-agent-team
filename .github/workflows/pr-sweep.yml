name: PR Sweep

# Periodically scans open PRs across stone16/* and dispatches code-review work
# to the Engineer peer lane (the Engineer instance that did not author the PR)
# and the Evaluator adversarial lane when needed. Filtering is deterministic
# shell — no LLM is invoked unless real review work exists.
#
# Operational identity (agent names, mention links, workspace id, ignore list)
# lives in GitHub Actions secrets/variables — never in tracked files.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Avoid overlapping sweeps. If a sweep is still running when the next cron tick
# fires, the new run is queued, not started in parallel — prevents duplicate
# Multica issue creation for the same PR.
concurrency:
  group: pr-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      MULTICA_TOKEN: ${{ secrets.MULTICA_TOKEN }}
      MULTICA_SERVER_URL: 'https://api.multica.ai'
      MULTICA_WORKSPACE_ID: ${{ vars.MULTICA_WORKSPACE_ID }}
      GH_OWNER: stone16
      # Multica assignee names; the script defaults to Engineer-A / Engineer-B /
      # Evaluator / CEO when a variable is unset.
      ENGINEER_A_AGENT: ${{ vars.ENGINEER_A_AGENT }}
      ENGINEER_B_AGENT: ${{ vars.ENGINEER_B_AGENT }}
      EVALUATOR_AGENT: ${{ vars.EVALUATOR_AGENT }}
      CEO_AGENT: ${{ vars.CEO_AGENT }}
      # Mention links in the `[@Name](mention://agent/<uuid>)` form. CEO_MENTION
      # is the escalation target; the Engineer/Evaluator mentions map a PR's
      # `Original author:` line to a roster identity for the peer-lane pick and
      # for author rework routing.
      CEO_MENTION: ${{ vars.CEO_MENTION }}
      ENGINEER_A_MENTION: ${{ vars.ENGINEER_A_MENTION }}
      ENGINEER_B_MENTION: ${{ vars.ENGINEER_B_MENTION }}
      EVALUATOR_MENTION: ${{ vars.EVALUATOR_MENTION }}
      # Newline-separated repo names to exclude from the sweep. Kept as a
      # GitHub Actions variable so private repo names never live in tracked
      # files; the tracked .pr-sweep-ignore file is the fallback when unset.
      PR_SWEEP_IGNORE: ${{ vars.PR_SWEEP_IGNORE }}
    steps:
      - name: Check required secrets and variables are present
        run: |
          set -e
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is not configured. Generate a GitHub PAT with 'repo' scope and add it to repo secrets."
            exit 1
          fi
          if [ -z "$MULTICA_TOKEN" ]; then
            echo "::error::MULTICA_TOKEN secret is not configured. Generate a Multica PAT and add it to repo secrets."
            exit 1
          fi
          if [ -z "$MULTICA_WORKSPACE_ID" ]; then
            echo "::error::MULTICA_WORKSPACE_ID variable is not configured. Add the Multica workspace UUID as a GitHub Actions variable."
            exit 1
          fi
          if [ -z "$CEO_MENTION" ]; then
            echo "::error::CEO_MENTION variable is not configured. Add the CEO mention link ([@CEO](mention://agent/<uuid>)) as a GitHub Actions variable so escalations reach the CEO."
            exit 1
          fi
          if [ -z "$ENGINEER_A_MENTION" ] || [ -z "$ENGINEER_B_MENTION" ]; then
            echo "::warning::ENGINEER_A_MENTION / ENGINEER_B_MENTION variables are not fully configured. The peer-lane pick degrades to always dispatching Engineer-A, and rework routing falls back to CEO escalation."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install multica CLI
        env:
          MULTICA_VERSION: '0.2.26'
        run: |
          set -e
          curl -fsSL "https://github.com/multica-ai/multica/releases/download/v${MULTICA_VERSION}/multica-cli-${MULTICA_VERSION}-linux-amd64.tar.gz" \
            | tar -xz multica
          sudo mv multica /usr/local/bin/multica
          multica --version

      - name: Configure multica CLI
        run: |
          set -e
          multica config set server_url "$MULTICA_SERVER_URL"
          multica config set workspace_id "$MULTICA_WORKSPACE_ID"

      - name: Authenticate multica
        run: multica login --token "$MULTICA_TOKEN"

      - name: Authenticate gh (with cross-repo PAT)
        run: |
          printf '%s' "$GH_PAT" | gh auth login --with-token
          gh auth status

      - name: Run PR sweep
        run: ./.github/scripts/pr-sweep.sh
